spring:
  task:
    scheduling:
      pool:
        size: 2
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  # Keep service bootable in emulator environments even when no explicit Spring profile is set.
  cloud:
    gcp:
      credentials:
        enabled: ${SPRING_CLOUD_GCP_CREDENTIALS_ENABLED:false}
      project-id: ${SPRING_CLOUD_GCP_PROJECT_ID:${SPRING_CLOUD_GCP_PUBSUB_PROJECT_ID:our-project}}
      pubsub:
        credentials:
          enabled: ${SPRING_CLOUD_GCP_PUBSUB_CREDENTIALS_ENABLED:false}
        project-id: ${SPRING_CLOUD_GCP_PUBSUB_PROJECT_ID:${SPRING_CLOUD_GCP_PROJECT_ID:our-project}}
        emulator-host: ${SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST:}
        subscriber:
          parallel-pull-count: ${PUBSUB_SUBSCRIBER_PARALLEL_PULL_COUNT:2}
          executor-threads: ${PUBSUB_SUBSCRIBER_EXECUTOR_THREADS:4}
          max-ack-extension-period: 300
          flow-control:
            max-outstanding-element-count: ${PUBSUB_SUBSCRIBER_MAX_OUTSTANDING_ELEMENT_COUNT:500}
            max-outstanding-request-bytes: ${PUBSUB_SUBSCRIBER_MAX_OUTSTANDING_REQUEST_BYTES:20971520}

queueconfig:
  case-update-subscription: event_case-update_rm-fieldwork-adapter
  fieldwork-action-instruction-topic: event_fieldwork_action-instruction
  publishtimeout: 10  # In seconds
  retry:
    max-attempts: 3
    delay: 1000 #milliseconds

healthcheck:
  frequency: 15000 #milliseconds
  filename: /tmp/fieldwork-adapter-healthy

logging:
  profile: DEV
  level:
    root: INFO
    com.google.cloud.spring.pubsub.integration.inbound.PubSubInboundChannelAdapter: ERROR


