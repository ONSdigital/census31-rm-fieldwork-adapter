spring:
  task:
    scheduling:
      pool:
        size: 15

  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  jackson:
    # Boot 4 migration: freeze Spring's own mapper at Jackson 2 behaviour so
    # this release changes no contract. REMOVE in H2 2027 as its own
    # announced change, estate-wide.
    use-jackson2-defaults: true

  cloud:
    gcp:
      pubsub:
        subscriber:
          flow-control:
            max-outstanding-element-count: 100

queueconfig:
  case-update-subscription: event_case-update_rm-fieldwork-adapter
  fieldwork-action-instruction-topic: event_fieldwork_action-instruction
  publishtimeout: 10  # In seconds

healthcheck:
  frequency: 15000 #milliseconds
  filename: /tmp/fieldwork-adapter-healthy

exceptionmanager:
  connection:
    scheme: http
    host: localhost
    port: 8666

messagelogging:
  logstacktraces: false

logging:
  profile: DEV
  level:
    root: INFO
    com.google.cloud.spring.pubsub.integration.inbound.PubSubInboundChannelAdapter: ERROR
