version: '2.1'
services:
  pubsub-emulator-case-it:
    container_name: pubsub-emulator-case-it
    image: europe-west2-docker.pkg.dev/c31-rm-ci-prod/rm-docker-snapshot/gcloud-pubsub-emulator:latest
    ports:
      - "18538:8538"

  setup-pubsub-emulator-case-it:
    container_name: setup-pubsub-emulator-case-it
    image: europe-west2-docker.pkg.dev/c31-rm-ci-prod/rm-docker-snapshot/gcloud-pubsub-emulator:latest
    environment:
      - PUBSUB_SETUP_HOST=pubsub-emulator-case-it:8538
    volumes:
      - ./setup_pubsub.sh:/setup_pubsub.sh
    depends_on:
      - pubsub-emulator-case-it
    entrypoint: sh -c "/setup_pubsub.sh"

  start_dependencies:
    image: dadarek/wait-for-dependencies
    depends_on:
      uac-qid-case-it:
        condition: service_healthy

networks:
  default:
    external:
      name: censusrmdockerdev_default
